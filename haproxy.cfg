global
    log /dev/log local0
    log /dev/log local1 notice
    daemon
    maxconn 256

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

frontend stein-frontend
    bind *:80
    default_backend stein-pool

backend stein-pool
    balance roundrobin
    server web1 10.0.1.11:80 check
   
listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
